<div class="modal-overlay" *ngIf="isModalVisible" (click)="cerrarModal()"></div>

<div class="modal" *ngIf="isModalVisible">
  <div class="modal-content">
    <h2>Crear Evento</h2>
    <form [formGroup]="eventoForm" (ngSubmit)="crearEvento()">
      <div class="input-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" formControlName="nombre" required />
        <div *ngIf="eventoForm.get('nombre')?.invalid && eventoForm.get('nombre')?.touched">
          <small>El nombre es obligatorio.</small>
        </div>
      </div>

      <div class="input-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" formControlName="descripcion" required></textarea>
        <div *ngIf="eventoForm.get('descripcion')?.invalid && eventoForm.get('descripcion')?.touched">
          <small>La descripción es obligatoria.</small>
        </div>
      </div>

      <div class="input-group">
        <label for="fechaHora">Fecha y Hora</label>
        <input type="datetime-local" id="fechaHora" formControlName="fechaHora" required />
        <div *ngIf="eventoForm.get('fechaHora')?.invalid && eventoForm.get('fechaHora')?.touched">
          <small>La fecha y hora son obligatorias.</small>
        </div>
      </div>

      <div class="input-group">
        <label for="ubicacion">Ubicación</label>
        <input type="text" id="ubicacion" formControlName="ubicacion" required />
        <div *ngIf="eventoForm.get('ubicacion')?.invalid && eventoForm.get('ubicacion')?.touched">
          <small>La ubicación es obligatoria.</small>
        </div>
      </div>

      <div class="input-group">
        <label for="capacidad">Capacidad</label>
        <input
          type="number"
          id="capacidad"
          formControlName="capacidad"
          required
          min="1"
        />
        <div *ngIf="eventoForm.get('capacidad')?.invalid && eventoForm.get('capacidad')?.touched">
          <small>La capacidad debe ser al menos 1.</small>
        </div>
      </div>

      <button type="submit" [disabled]="eventoForm.invalid">Crear Evento</button>
      <button type="button" class="close-btn" (click)="cerrarModal()">Cancelar</button>
    </form>
  </div>
</div>
